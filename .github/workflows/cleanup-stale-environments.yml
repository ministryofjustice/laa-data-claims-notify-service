name: Cleanup Stale Environments

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  cleanup-stale:
    name: Remove Stale Ephemeral Environments
    runs-on: ubuntu-latest
    environment: uat

    steps:
      - name: Authenticate to Kubernetes Cluster
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/authenticate_to_cluster@2aa2676c3cd9876ec7037ee8b3d729d0306cb7c6
        with:
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}

      - name: Cleanup Stale Environments
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        shell: python3 {0}
        run: |
          import json
          import os
          import subprocess
          import sys
          from datetime import datetime, timedelta, timezone

          MAX_AGE_DAYS = 7
          namespace = os.environ["KUBE_NAMESPACE"]
          cutoff = datetime.now(timezone.utc) - timedelta(days=MAX_AGE_DAYS)

          print(f"Cutoff: {cutoff.strftime('%Y-%m-%d')} ({MAX_AGE_DAYS} days)")

          result = subprocess.run(
              ["helm", "list", "-n", namespace, "--output", "json"],
              capture_output=True, text=True, check=True
          )
          releases = json.loads(result.stdout)

          stale_prefixes = ("pr-",)
          targets = [r for r in releases if r["name"].startswith(stale_prefixes)]

          print(f"\n=== Processing {len(targets)} ephemeral release(s) ===")

          failed = []

          for release in targets:
              name = release["name"]
              updated = datetime.strptime(release["updated"][:19], "%Y-%m-%d %H:%M:%S").replace(tzinfo=timezone.utc)

              if updated < cutoff:
                  print(f"STALE: {name} (last updated: {updated.strftime('%Y-%m-%d')}) - removing")
                  if subprocess.run(["helm", "uninstall", name, "-n", namespace]).returncode != 0:
                      failed.append(name)
              else:
                  print(f"ACTIVE: {name} (last updated: {updated.strftime('%Y-%m-%d')}) - keeping")

          if failed:
              sys.exit(f"\nFailed to remove: {', '.join(failed)}")

          print("\n=== Cleanup complete ===")
