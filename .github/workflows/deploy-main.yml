name: Deploy main

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  assemble:
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/gradle-build-and-publish.yml@v2.1.1
    permissions:
      contents: write
      packages: write
    with:
      build_command: 'assemble'
      publish_package: false
      junit_results: 'false'
      junit_report: 'false'
      checkstyle_report: 'false'
      jacoco_coverage_report: 'false'
      semgrep_check: 'true'
      java_version: 25
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}

  #pact-test:
  #  needs: [ assemble ]
  #  uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/pact-and-publish.yml@v2
  #  permissions:
  #    contents: write
  #    packages: write
  #  with:
  #    pacticipant_name: "laa-data-claims-notify-service"
  #    pact_test_task: "pactTest"
  #    publish_pact_results: true
  #    git_branch: 'main'
  #    pact_tags: '${{ needs.assemble.outputs.published_artifact_version }},candidate'
  ##    java_version: 25
  #  secrets:
  #    gh_token: ${{ secrets.GITHUB_TOKEN }}
  #    pact_broker_url: 'https://laa-data-pact-broker.apps.live.cloud-platform.service.justice.gov.uk/'
  #    pact_broker_username: ${{ secrets.PACT_BROKER_USERNAME }}
  #    pact_broker_password: ${{ secrets.PACT_BROKER_PASSWORD }}
  pact-test:
    runs-on: ubuntu-latest
    steps:
      - name: Disabled job
        id: disabled-job
        run: |
          echo "This job is disabled and will not run"

  ecr-publish-image:
    needs: [ assemble ]
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/ecr-publish-image.yml@v2.1.1
    permissions:
      contents: read
      id-token: write
      security-events: write
    with:
      jar_subproject: 'laa-data-claims-notify-service'
      image_version: ${{ format('{0}-{1}', vars.IMAGE_PREFIX, needs.assemble.outputs.published_artifact_version) }}
      java_version: 25
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      ecr_repository: ${{ vars.LAA_DATA_CLAIMS_NOTIFY_SERVICE_ECR_REPOSITORY }}
      ecr_region: ${{ vars.LAA_DATA_CLAIMS_NOTIFY_SERVICE_ECR_REGION }}
      ecr_role_to_assume: ${{ secrets.LAA_DATA_CLAIMS_NOTIFY_SERVICE_ECR_ROLE_TO_ASSUME }}
      snyk_client_id: ${{ secrets.SNYK_CLIENT_ID }}
      snyk_client_secret: ${{ secrets.SNYK_CLIENT_SECRET }}

  deploy-uat:
    needs:
      - ecr-publish-image
      - pact-test
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/helm-deploy.yml
    with:
      environment: uat
      deployment_name: uat
      claim_api_environment_name: main
      image_tag: ${{ needs.ecr-publish-image.outputs.published_image_version }}
    secrets: inherit

  deploy-staging:
    needs:
      - ecr-publish-image
      - deploy-uat
      - pact-test
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/helm-deploy.yml
    with:
      environment: staging
      deployment_name: stg
      claim_api_environment_name: stg
      image_tag: ${{ needs.ecr-publish-image.outputs.published_image_version }}
    secrets: inherit

  deploy-production:
    needs:
      - ecr-publish-image
      - deploy-staging
      - pact-test
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/helm-deploy.yml
    with:
      environment: production
      deployment_name: prod
      claim_api_environment_name: prod
      image_tag: ${{ needs.ecr-publish-image.outputs.published_image_version }}
    secrets: inherit
