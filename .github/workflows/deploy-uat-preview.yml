name: Deploy UAT preview (branch)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/gradle-build-and-publish.yml@v2.5.0
    permissions:
      contents: write
      packages: write
    with:
      publish_package: false
      integration_test_task: integrationTest
      semgrep_check: 'true'
      java_version: 25
      jacoco_coverage_report: 'true'
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}

  #pact-test:
  #  needs: [ define-snapshot-version ]
  #  uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/pact-and-publish.yml@v2
  #  permissions:
  #    contents: write
  #    packages: write
  #  with:
  #    pacticipant_name: "laa-data-claims-notify-service"
  #    pact_test_task: "pactTest"
  #    publish_pact_results: true
  #    enable_can_i_merge: true
  #    provider_name: "laa-data-claims-api"
  #    pact_tags: "feature"
  #    java_version: 25
  #  secrets:
  #    gh_token: ${{ secrets.GITHUB_TOKEN }}
  #    pact_broker_url: 'https://laa-data-pact-broker.apps.live.cloud-platform.service.justice.gov.uk/'
  #    pact_broker_username: ${{ secrets.PACT_BROKER_USERNAME }}
  #    pact_broker_password: ${{ secrets.PACT_BROKER_PASSWORD }}

  ecr-publish-image:
    needs: [ build-and-test ]
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/ecr-publish-image.yml@v2.5.0
    permissions:
      contents: read
      id-token: write
      security-events: write
    with:
      dockerfile_path: 'Dockerfile'
      image_version: ${{ format('{0}-{1}', vars.IMAGE_PREFIX, github.sha) }}
      java_version: 25
      image_scan: 'false'
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      ecr_repository: ${{ vars.LAA_DATA_CLAIMS_NOTIFY_SERVICE_ECR_REPOSITORY }}
      ecr_region: ${{ vars.LAA_DATA_CLAIMS_NOTIFY_SERVICE_ECR_REGION }}
      ecr_role_to_assume: ${{ secrets.LAA_DATA_CLAIMS_NOTIFY_SERVICE_ECR_ROLE_TO_ASSUME }}
      snyk_client_id: ${{ secrets.SNYK_CLIENT_ID }}
      snyk_client_secret: ${{ secrets.SNYK_CLIENT_SECRET }}
      
  snyk-image-scan:
    needs: [ ecr-publish-image ]
    uses: ./.github/workflows/snyk-docker-scan.yml
    permissions:
      contents: read
      security-events: write
      id-token: write
    with:
      branch: ${{ github.sha }}
      image_tag: ${{ needs.ecr-publish-image.outputs.published_image_version }}
      aws_region: ${{ vars.LAA_DATA_CLAIMS_NOTIFY_SERVICE_ECR_REGION }}
      ecr_repository: ${{ vars.LAA_DATA_CLAIMS_NOTIFY_SERVICE_ECR_REPOSITORY }}
      image_scan_threshold: 'high'
    secrets:
      ECR_ROLE_TO_ASSUME: ${{ secrets.LAA_DATA_CLAIMS_NOTIFY_SERVICE_ECR_ROLE_TO_ASSUME }}
      SNYK_CLIENT_ID: ${{ secrets.SNYK_CLIENT_ID }}
      SNYK_CLIENT_SECRET: ${{ secrets.SNYK_CLIENT_SECRET }}

  deploy-uat-preview:
    needs:
      #- pact-test
      - ecr-publish-image
    runs-on: ubuntu-latest
    environment: uat
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy UAT preview branch
        id: deploy
        uses: ./.github/actions/deploy_branch
        with:
          ecr-region: ${{ vars.LAA_DATA_CLAIMS_NOTIFY_SERVICE_ECR_REGION }}
          ecr-role-to-assume: ${{ secrets.LAA_DATA_CLAIMS_NOTIFY_SERVICE_ECR_ROLE_TO_ASSUME }}
          ecr-repository: ${{ vars.LAA_DATA_CLAIMS_NOTIFY_SERVICE_ECR_REPOSITORY }}
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          app-environment: uat
          pr-number: ${{ github.event.pull_request.number }}
          image-tag: ${{ needs.ecr-publish-image.outputs.published_image_version }}