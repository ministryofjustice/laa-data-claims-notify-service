services:
  notify-service:
    depends_on:
      localstack:
        condition: service_healthy
    container_name: data-claims-notify-service
    build:
      context: .
      dockerfile: Dockerfile_internal
    ports:
      - "8183:8183"
      - "5083:5083"
    environment:
      - SERVER_PORT=8083
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_CLOUD_AWS_SQS_ENDPOINT=http://localstack:4566
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5083
